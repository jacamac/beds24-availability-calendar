name: Dev Release

# Runs on every push to the development branch.
# Lints first, then builds a correctly-named plugin zip and attaches it
# to the rolling 'dev-latest' pre-release so PUC on dev sites can update
# automatically without needing a version tag.
on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer, cs2pr

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPCS
        run: ./vendor/bin/phpcs --report=checkstyle -q | cs2pr

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Audit dependencies for known CVEs
        run: composer audit

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: JS & CSS lint
        run: npm run lint

  release:
    name: Build & Publish dev-latest
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Build zip
        run: |
          mkdir -p /tmp/build/availability-calendar-for-beds24

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='.claude' \
            --exclude='.stylelintrc.json' \
            --exclude='CLAUDE.md' \
            --exclude='ELEMENTOR_WIDGET_GUIDE.md' \
            --exclude='README.md' \
            --exclude='eslint.config.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='node_modules' \
            --exclude='phpcs.xml' \
            --exclude='phpstan.neon' \
            --exclude='vendor' \
            --exclude='*.zip' \
            . /tmp/build/availability-calendar-for-beds24/

          composer install --no-dev --prefer-dist --no-progress --no-interaction \
            --working-dir=/tmp/build/availability-calendar-for-beds24

          rm /tmp/build/availability-calendar-for-beds24/composer.json
          rm /tmp/build/availability-calendar-for-beds24/composer.lock

          cd /tmp/build
          zip -r availability-calendar-for-beds24.zip availability-calendar-for-beds24/

      - name: Update dev-latest pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: dev-latest
          name: "Development Build (latest)"
          prerelease: true
          make_latest: false
          files: /tmp/build/availability-calendar-for-beds24.zip
          body: |
            Automated development build — **not for production use**.

            Branch: `development`
            Commit: `${{ github.sha }}`
            Built: ${{ github.event.head_commit.timestamp }}

            Install via **WordPress Admin → Plugins → Add New → Upload Plugin**,
            or let PUC update automatically if `BAC_UPDATE_BRANCH` is set in `wp-config.php`.
