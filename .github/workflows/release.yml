name: Release

# Triggers when you push a version tag: git tag v1.0.1 && git push --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build zip
        run: |
          # Create a clean temp directory with the plugin folder name
          mkdir -p /tmp/build/beds24-availability-calendar

          # Copy only distributable files — exclude all dev/tooling files
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='.claude' \
            --exclude='CLAUDE.md' \
            --exclude='README.md' \
            --exclude='phpcs.xml' \
            --exclude='phpstan.neon' \
            --exclude='vendor' \
            --exclude='*.zip' \
            . /tmp/build/beds24-availability-calendar/

          # Install runtime dependencies only (ships PUC in vendor/, no dev tools)
          composer install --no-dev --prefer-dist --no-progress --no-interaction \
            --working-dir=/tmp/build/beds24-availability-calendar

          # Remove composer manifests — not needed at runtime
          rm /tmp/build/beds24-availability-calendar/composer.json
          rm /tmp/build/beds24-availability-calendar/composer.lock

          # Inject the tag version — no manual version bump needed on each release
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^\( \* Version: *\).*/\1${VERSION}/" \
            /tmp/build/beds24-availability-calendar/beds24-availability-calendar.php
          sed -i "s/define( 'BAC_VERSION', '[^']*' );/define( 'BAC_VERSION', '${VERSION}' );/" \
            /tmp/build/beds24-availability-calendar/beds24-availability-calendar.php
          sed -i "s/^Stable tag:.*/Stable tag:         ${VERSION}/" \
            /tmp/build/beds24-availability-calendar/readme.txt

          # Create the zip from the temp directory
          cd /tmp/build
          zip -r beds24-availability-calendar-${{ steps.version.outputs.VERSION }}.zip \
            beds24-availability-calendar/

      - name: Generate release notes from readme.txt
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          {
            echo "## What's new in v${VERSION}"
            echo ""
            awk "/^= ${VERSION} =/{found=1;next} found && /^= /{exit} found && NF{print}" readme.txt
            echo ""
            echo "---"
            echo ""
            echo "**Installation:** Download the zip below and install via **WordPress Admin → Plugins → Add New → Upload Plugin**."
            echo ""
            echo "If you use [Git Updater](https://git-updater.com/), this release will be detected automatically."
          } > /tmp/release-notes.md

      - name: Create GitHub Release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.version.outputs.VERSION }}"
          body_path: /tmp/release-notes.md
          files: /tmp/build/beds24-availability-calendar-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
