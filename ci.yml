name: CI

# Runs on every push to develop and on PRs targeting main.
# Catches security and code quality issues before they reach production.
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  phpcs:
    name: PHP CodeSniffer (WordPress Coding Standards)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer, cs2pr

      - name: Install dependencies
        run: |
          composer require --dev \
            squizlabs/php_codesniffer \
            wp-coding-standards/wpcs \
            phpcsstandards/phpcsutils \
            phpcsstandards/phpcsextra
          # Register the WordPress standard with PHPCS
          ./vendor/bin/phpcs --config-set installed_paths \
            vendor/wp-coding-standards/wpcs,\
            vendor/phpcsstandards/phpcsutils,\
            vendor/phpcsstandards/phpcsextra

      - name: Run PHPCS
        # cs2pr converts PHPCS output to GitHub annotations (inline PR comments)
        run: |
          ./vendor/bin/phpcs \
            --standard=WordPress \
            --extensions=php \
            --ignore=vendor/ \
            --report=checkstyle \
            . | cs2pr

  phpstan:
    name: PHPStan (Static Analysis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install dependencies
        run: |
          composer require --dev \
            phpstan/phpstan \
            szepeviktor/phpstan-wordpress \
            php-stubs/wordpress-stubs \
            php-stubs/wordpress-globals

      - name: Run PHPStan
        run: |
          ./vendor/bin/phpstan analyse \
            --level=6 \
            --configuration=phpstan.neon \
            beds24-availability-calendar.php widgets/
